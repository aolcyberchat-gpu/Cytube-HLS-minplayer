<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infinite Slop</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    controls>
</video>

<script>
(function () {

    const video = document.getElementById("video");

    const stream =
        "https://infiniteslop.ai/live/playlist.m3u8";

    /*
     * Chrome/Android generally requires muted
     * playback for autoplay.
     */

    video.muted = true;

    /*
     * Safari/iOS can play HLS natively.
     */

    if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = stream;

        video.addEventListener("loadedmetadata", function () {

            video.play().catch(function () {
                console.log("Autoplay blocked.");
            });

        });

        return;
    }

    /*
     * Chrome/Firefox/Android:
     * use hls.js.
     */

    if (Hls.isSupported()) {

        const hls = new Hls({
            liveSyncDurationCount: 3
        });

        hls.loadSource(stream);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            video.play().catch(function () {
                console.log("Autoplay blocked.");
            });

        });

        /*
         * Recover from temporary live-stream errors.
         */

        hls.on(Hls.Events.ERROR, function (event, data) {

            if (!data.fatal) {
                return;
            }

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                console.log("HLS network error. Retrying...");

                hls.startLoad();

            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                console.log("HLS media error. Recovering...");

                hls.recoverMediaError();

            }

        });

        return;
    }

    document.body.innerHTML =
        '<div style="color:white;font-family:sans-serif;text-align:center;padding-top:40px;">' +
        'HLS playback is not supported by this browser.' +
        '</div>';

})();

</script>

</body>
</html>
