<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Infinite Slop</title>

<script src="hls.min.js"></script>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}

video {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}

</style>

</head>

<body>

<video
    id="tv"
    muted
    autoplay
    playsinline>
</video>

<script>

const PLAYLIST =
    'https://infiniteslop.ai/live/playlist.m3u8';

const tv =
    document.getElementById('tv');

let usingHls = false;

let hlsRef = null;


/* --------------------------------------------------
   Start Infinite Slop live stream
-------------------------------------------------- */

function startVideo() {

    /*
     * HLS.js
     */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        usingHls = true;

        const h =
            hlsRef =
                new Hls({
                    liveSyncDurationCount: 2
                });


        h.loadSource(PLAYLIST);

        h.attachMedia(tv);


        /*
         * Infinite Slop's FRAG_CHANGED
         *
         * We don't need their clip/replay system,
         * but we keep the event because it is part
         * of their live-player behavior.
         */

        h.on(
            Hls.Events.FRAG_CHANGED,
            (_, d) => {

                /*
                 * The live playlist is advancing.
                 *
                 * Nothing else is required here
                 * for our standalone player.
                 */

            }
        );


        /*
         * Infinite Slop explicitly positions the
         * player on the newest fragment when the
         * playlist first loads.
         */

        let positioned = false;

        h.on(
            Hls.Events.LEVEL_LOADED,
            (_, d) => {

                if (positioned) {
                    return;
                }

                positioned = true;


                let best = null;

                let bestId = -1;


                for (
                    const f of d.details.fragments
                ) {

                    const n =
                        parseInt(
                            f.url
                                .split('/')
                                .pop()
                                .split('?')[0],
                            10
                        );


                    if (
                        !isNaN(n) &&
                        n > bestId
                    ) {

                        bestId = n;

                        best = f;

                    }

                }


                if (best) {

                    tv.currentTime =
                        best.start + 0.05;

                }

            }
        );


        /*
         * Same fatal-error recovery as Infinite Slop.
         */

        h.on(
            Hls.Events.ERROR,
            (_, d) => {

                if (!d.fatal) {
                    return;
                }


                setTimeout(
                    () => {

                        try {
                            h.destroy();
                        } catch (e) {}


                        hlsRef = null;


                        startVideo();

                    },
                    3000
                );

            }
        );

    }

    /*
     * Native HLS fallback.
     */

    else if (
        tv.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        tv.src = PLAYLIST;

    }


    /*
     * Start playback.
     */

    tv.play().catch(() => {});

}


/* --------------------------------------------------
   Start
-------------------------------------------------- */

startVideo();

</script>

</body>

</html>
